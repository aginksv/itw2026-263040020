<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh register</title>
</head>

<body>
  <h1>Register Absensi</h1>

  <form>
    <label for="name">Nama:
      <input type="text" name="nama" id="nama" placeholder="Masukkan nama lengkap">
    </label>
    <br>

    <label for="password">Password:
      <input type="password" name="password" id="password">
    </label>
    <br>

    <label for="email">Email:
      <input type="email" name="email" id="email"> 
    </label>
    <br>
 
    <label for="angka">angka:
      <input type="number" name="angka" id="angka" min="0" max="100" step="5">
    </label>
    <br>

    <label for="tanggal">Tanggal Lahir:
      <input type="date" name="tanggal" id="tanggal">
    </label>
    <br>

    <label for="warna">Pilih Warna
      <input type="color" name="warna" id="warna">
    </label>
    <br>

    <button type="submit">Kirim!</button>
  </form>
</body>

</html>
