<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Text - Text Overflow & Text Shadow</title>
  <style>
    p {
      font-size: 26px;
      white-space: nowrap;
      width: 300px;
      background-color: rgb(180, 230, 173);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      font-size: 100px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      text-shadow: 5px 5px 0 rgb(0, 119, 130);
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(173, 230, 223);
      text-decoration-skip-ink: none;
    }
  </style>
</head>

<body>
  <h1>Hello, CSS!</h1>
  <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Cum quasi molestias nemo sequi, in asperiores doloremque
    nisi consequatur voluptatibus accusamus enim voluptatum voluptatem, perspiciatis voluptates sunt, aliquam sapiente
    sint eum.</p>
</body>

</html>
