<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiple backgrounds</title>
    <style>
        body {
            min-height: 100vh;
            font-family: sans-serif;
            background-color: lightblue;
        }
        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid black;
            margin:auto;
            background-image: url(img/agin.png), url(img/xtc.png), url(img/api.png);
            background-size: 320px, 400px, 700px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center 70%, bottom left;
            background-color: rgb(255, 77, 0);
            border-radius: 50%;
        }
        h1{
            color: white;
            text-align: center;
            font-family: sans-serif;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>
    <h1>my profile card</h1>
    <div class="frame"></div>
</body>
</html>
