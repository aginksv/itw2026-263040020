<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #717171;
      text-align: center;
      background-color: #00f7ff;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #29778d;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      color: #847f00;
    }

    .quote {
      font-size: 25px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: crimson;
      text-decoration: line-through;
    }

    .credit {
      font-size: 20px;
      letter-spacing: 2px;
      color: rgba(0, 0, 0, 0.7);
      font-weight: normal;
    }
  </style>
</head>

<body>

 <h1>Menepi dari Kebisingan </h1>

  <p class="quote">
    "Terkadang, <span>diam</span> adalah jawaban terbaik<br>
     untuk dunia yang terlalu bising dengan penilaian."
  </p>

  <p class="credit">— Suryo Utomo</p>
</body>

</html>
