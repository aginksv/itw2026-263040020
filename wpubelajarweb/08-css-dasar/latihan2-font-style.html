<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    body {
      font-family: 'Chewy', system-ui, sans-serif;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(100, 100, 100);
      text-shadow: 5px 5px 0 rgb(215, 215, 215);
    }

    .quote {
      font-size: 25px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: rgb(181, 181, 181);
      text-decoration: line-through;
    }

    .credit {
      font-size: 20px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>Menepi dari Kebisingan </h1>

  <p class="quote">
    "Terkadang, <span>diam</span> adalah jawaban terbaik<br>
     untuk dunia yang terlalu bising dengan penilaian."
  </p>

  <p class="credit">— Suryo Utomo</p>

</body>

</html>
