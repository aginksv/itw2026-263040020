<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Css - selector & property</title>
  <style>
        h1 {
            font-size: 150px;
            font-family: Arial;
            color: red;
            text-align: center;
        }

        p {
            color: blue;
            text-align: center;
        }

        .p2 {
            color: green;
            text-align: center;
        }

        #judul {
            text-transform: uppercase;
        }

        #garis-bawah {
            text-decoration: underline;
        }

        .cetak-miring {
            font-style: italic;
        }


    </style>
</head>
<body>
    <h1 id="judul" class="p2 cetak-miring">Hello World</h1>
    <p id="garis-bawah" class="cetak-miring">Lorem ipsum dolor sit amet consectetur adipisicing elit. Placeat facere, voluptates nostrum dicta esse ratione dolores quasi ad consequatur nemo!</p>
    <p class="p2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempore, quibusdam!</p>
</body>
</html>
